[project]
name = "sytra-runner"
version = "1.2.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "huggingface-hub>=0.34",
    "hf-xet>=1.1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sytra_runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
