name: Build and Release Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]*'
    branches:
      - main
    paths-ignore:
      - 'binaries/**'
      - 'README.md'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            studio_binary: target-build/release/sytra-studio.exe
            mcp_binary: target-build/release/sytra-mcp.exe
          - os: macos-latest
            platform: macos
            studio_binary: target-build/release/sytra-studio
            mcp_binary: target-build/release/sytra-mcp
          - os: ubuntu-latest
            platform: linux
            studio_binary: target-build/release/sytra-studio
            mcp_binary: target-build/release/sytra-mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd ui
          npm ci

      - name: Build Frontend
        run: |
          cd ui
          npm run build

      - name: Install System Dependencies (Linux only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Build Sytra MCP Server
        run: cargo build -p sytra-mcp --release

      - name: Build Sytra Studio UI
        run: cargo build -p sytra-studio --release --features custom-protocol

      - name: Stage Binaries
        shell: bash
        run: |
          mkdir -p dist-bin
          cp ${{ matrix.studio_binary }} dist-bin/
          cp ${{ matrix.mcp_binary }} dist-bin/

      - name: Upload Binaries Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: dist-bin/*
          retention-days: 1

  commit-binaries:
    name: Commit Binaries to Git
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows Binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-windows
          path: temp-binaries/windows

      - name: Download macOS Binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-macos
          path: temp-binaries/macos

      - name: Download Linux Binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux
          path: temp-binaries/linux

      - name: Organize Binaries
        run: |
          mkdir -p binaries/windows binaries/macos binaries/linux
          
          # Copy Windows
          cp -r temp-binaries/windows/* binaries/windows/
          
          # Copy macOS
          cp -r temp-binaries/macos/* binaries/macos/
          
          # Copy Linux
          cp -r temp-binaries/linux/* binaries/linux/
          
          # Clean temp files
          rm -rf temp-binaries

      - name: Rebase with latest main
        run: |
          git pull --rebase origin main || true

      - name: Commit and Push Binaries
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "chore: update release binaries for Windows, macOS, and Linux [skip ci]"
          file_pattern: "binaries/**"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

  publish-release:
    name: Publish immutable tagged binaries
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Name platform assets and portable archives
        shell: bash
        run: |
          mkdir -p release-assets
          cp scripts/install.ps1 release-assets/install.ps1
          cp scripts/install.sh release-assets/install.sh
          for platform in windows macos linux; do
            extension=''
            if [ "$platform" = windows ]; then extension='.exe'; fi
            stage="portable-$platform"
            mkdir -p "$stage/runner"
            cp runner/pyproject.toml "$stage/runner/"
            cp -r runner/sytra_runner runner/scripts "$stage/runner/"
            find "$stage/runner" -type d \( -name '__pycache__' -o -name '.pytest_cache' -o -name '*.egg-info' \) -prune -exec rm -rf {} +
            if [ "$platform" = windows ]; then
              cp scripts/install.ps1 "$stage/install.ps1"
            else
              cp scripts/install.sh "$stage/install.sh"
              chmod +x "$stage/install.sh"
            fi
            for program in sytra-studio sytra-mcp; do
              cp "release-artifacts/binaries-$platform/$program$extension" "release-assets/$program-$platform$extension"
              cp "release-artifacts/binaries-$platform/$program$extension" "$stage/$program$extension"
              if [ "$platform" != windows ]; then chmod +x "$stage/$program$extension"; fi
            done
            if [ "$platform" = windows ]; then
              python3 - "$stage" "release-assets/sytra-studio-windows-portable.zip" <<'PY'
          import os, sys, zipfile
          src, out_zip = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(out_zip, 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, _, files in os.walk(src):
                  for name in sorted(files):
                      full = os.path.join(root, name)
                      zf.write(full, os.path.relpath(full, src))
          PY
            else
              tar -C "$stage" -czf "release-assets/sytra-studio-$platform-portable.tar.gz" .
            fi
          done
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - name: Publish release at the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Sytra Studio $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
